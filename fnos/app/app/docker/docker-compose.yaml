# magpie fnOS app. fnOS runs this compose file from the docker-project
# resource; ${TRIM_APPDEST} (the install target) is provided by fnOS.
#
# The magpie web key is negotiated between the containers at start: the
# bridge (root, writable mount) reads or generates /sock/magpie.env, and
# the magpie container's entrypoint waits for that file and sources it.
# No key material lives in the package or the compose file; the file sits
# in the app's own directory (wiped by an upgrade, regenerated at the next
# container start - browsers then sign in once more).
#
# Network posture: the console has no port of its own. The only way in is
# the fnOS unified gateway -> /var/apps/magpie/target/app.sock -> bridge ->
# magpie web's one-port server (page, /api/* and the /v1,/v1beta,/mcp
# gateway routes). The one published port is magpie's model-gateway port
# 3425, which LAN agents call directly; magpie demands a gateway key on
# every non-loopback request to it.
services:
  magpie:
    image: ghcr.io/callmehfk/magpie-fnos:0.1.3049
    container_name: magpie-app
    restart: unless-stopped
    environment:
      MAGPIE_ADDR: 0.0.0.0:3425
      MAGPIE_TRUST_PROXY: "1"
    ports:
      # LAN agents reach the model gateway here with a magpie gateway key
      # (magpie requires one for every non-loopback request); the web
      # console stays on the fnOS gateway route only
      - "3425:3425"
    volumes:
      # read-only: the magpie container (nonroot) only reads the key file
      - ${TRIM_APPDEST}:/sock:ro
      # magpie's own state - accounts, gateway keys, settings, the model
      # catalog - under $HOME/XDG dirs inside /config. A named volume rather
      # than the image's anonymous one: it keeps a stable name, so a
      # stop/start or an upgrade comes back to the same data, and Docker
      # seeds it from the image (uid 65532) on first use.
      - magpie-config:/config
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        while [ ! -s /sock/magpie.env ] && [ "$$i" -lt 120 ]; do
          sleep 1
          i=$$((i + 1))
        done
        if [ -s /sock/magpie.env ]; then
          . /sock/magpie.env
          export MAGPIE_WEB_KEY
        fi
        exec /magpie serve --web=0.0.0.0:3430

  bridge:
    # the bridge ships inside the package as a static Go binary; the image
    # is only its shell holder - the same magpie image already on the
    # device (kept local: no registry pull at install time), running as
    # root so it can create the socket in the host-owned target directory
    image: ghcr.io/callmehfk/magpie-fnos:0.1.3049
    user: "0:0"
    container_name: magpie-bridge
    restart: unless-stopped
    depends_on:
      - magpie
    entrypoint: ["/bin/sh", "-c", "exec /bin/bridge-dist/bridge-$$(uname -m)"]
    healthcheck:
      disable: true
    environment:
      BRIDGE_SOCKET: /sock/app.sock
      BRIDGE_UPSTREAM: http://magpie:3430
      BRIDGE_PREFIX: /app/magpie
      BRIDGE_COOKIE_NAME: magpie_web_3430
      BRIDGE_AUTH_HEADER: X-Trim-Userid
      BRIDGE_ADMIN_HEADER: X-Trim-Isadmin
      BRIDGE_KEY_FILE: /sock/magpie.env
      # the magpie container reads the key as this uid (the image's
      # nonroot); the bridge (root) hands the file to it with 0600 so no
      # other app on the device can read it
      BRIDGE_KEY_UID: "65532"
      BRIDGE_KEY_GID: "65532"
      BRIDGE_FETCH_SHIM: "1"
    volumes:
      # The fnOS gateway connects to <target>/app.sock; the bridge (as the
      # container's root, matching the host-owned install dir) creates both
      # the socket and the key file here. Unauthenticated socket clients
      # only reach magpie's own sign-in page - the key cookie is injected
      # for fnOS administrator sessions alone.
      - ${TRIM_APPDEST}:/sock
      - ${TRIM_APPDEST}/docker/bin:/bin/bridge-dist:ro

volumes:
  magpie-config: {}
