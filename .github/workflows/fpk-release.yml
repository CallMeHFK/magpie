name: FPK release

# Publishes, for the tracked upstream version: the two multi-arch images
# (magpie built from this checkout, the bridge from fnos/bridge) and the
# fnOS package release fnos-vX.Y.Z holding magpie.fpk.
on:
  push:
    branches: [main]
    paths:
      - "fnos/**"
      - ".github/workflows/fpk-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: fpk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the tracked version and guard consistency
        id: ver
        run: |
          set -eu
          ver="$(cat fnos/UPSTREAM_VERSION | tr -d '[:space:]')"
          tag="fnos-v$ver"
          for f in fnos/app/app/docker/docker-compose.yaml fnos/app/manifest; do
            grep -q "$ver" "$f" || { echo "::error::$f does not carry version $ver"; exit 1; }
          done
          if gh release view "$tag" --json name --jq .name >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already released
        if: steps.ver.outputs.exists == 'true'
        run: echo "release ${{ steps.ver.outputs.tag }} already exists - nothing to do"

      - name: Lowercase the image owner (ghcr requires lowercase)
        if: steps.ver.outputs.exists == 'false'
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

      - name: Check whether the images are already published
        id: images
        if: steps.ver.outputs.exists == 'false'
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          tok="$(curl -fsS "https://ghcr.io/token?scope=repository:${OWNER}/magpie-fnos:pull&scope=repository:${OWNER}/magpie-fnos-bridge:pull" | jq -r .token)"
          ok=1
          for repo in magpie-fnos magpie-fnos-bridge; do
            curl -fsS -H "Authorization: Bearer $tok" "https://ghcr.io/v2/${OWNER}/${repo}/tags/list" \
              | jq -e --arg v "$VERSION" '.tags | index($v)' >/dev/null || ok=0
          done
          echo "exist=$ok" >>"$GITHUB_OUTPUT"
          echo "images already published: $ok"

      - uses: docker/setup-qemu-action@v3
        if: steps.ver.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.ver.outputs.exists == 'false'
      - uses: docker/login-action@v3
        if: steps.ver.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push magpie image
        if: steps.ver.outputs.exists == 'false' && steps.images.outputs.exist != '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/magpie-fnos:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}

      - name: Build and push bridge image
        if: steps.ver.outputs.exists == 'false' && steps.images.outputs.exist != '1'
        uses: docker/build-push-action@v6
        with:
          context: fnos/bridge
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/magpie-fnos-bridge:${{ steps.ver.outputs.version }}

      - name: Build the FPK
        if: steps.ver.outputs.exists == 'false'
        run: |
          curl -fsSL -o /usr/local/bin/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack
          cd fnos/app && fnpack build
          test -f magpie.fpk

      - name: Publish the release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          notes="magpie fnOS package tracking [yetone/magpie v$VERSION](https://github.com/yetone/magpie/releases/tag/v$VERSION).

          Install: fnOS 应用中心 → 手动安装 → magpie.fpk. See FNOS.md for architecture, Connect access and agent configuration."
          git config user.name "magpie-fnos-release"
          git config user.email "actions@users.noreply.github.com"
          # annotated tag first (release rules: never lightweight), then
          # the release from it
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag \
            --title "$TAG" --notes "$notes" \
            fnos/app/magpie.fpk
